name: Auto-match YouTube videos

on:
  schedule:
    # 毎週月曜日 08:00 JST (= 前日日曜 23:00 UTC)
    # 新着YouTube動画側の変化（既存店舗に後から動画が上がるケース）を
    # 拾うためのフォールバック。店舗記事追加直後はworkflow_runの方で動く。
    - cron: '0 23 * * 0'
  workflow_dispatch: {}
  # 店舗記事の自動生成（Auto-generate spot article）が完了した直後に
  # 追いかけて実行する。新規記事があってもマッチングは週次まで待たされて
  # いたため、生成直後に反映されるようにする。
  workflow_run:
    workflows: ['Auto-generate spot article']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  match:
    # workflow_run発火の場合、上流（記事生成）が失敗した実行では走らせない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Match YouTube videos to spots
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run match:youtube

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/content/spots matched-candidates.json unmatched-videos.json

          if git diff --cached --quiet; then
            echo "No new video matches. Skipping commit."
            exit 0
          fi

          git commit -m "chore(spots): 燕三条TV動画の自動マッチング結果を反映"
          git push origin HEAD:${{ github.ref_name }}
